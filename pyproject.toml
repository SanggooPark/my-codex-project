[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rqms"
version = "1.0.0"
description = "ISO 22163:2023 기반 철도용 품질경영시스템(RQMS)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
keywords = ["ISO 22163", "IRIS", "railway", "quality management system", "RQMS"]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
rqms = "rqms.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rqms = ["data/*.json", "data/*.sql", "data/clauses/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/rqms/seed.py" = ["E501"]
"src/rqms/report.py" = ["E501"]
