name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 지원 최소 버전과 최신 버전을 모두 검증한다(pyproject requires-python).
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 레지스트리 정합성 및 통제 테스트
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

      - name: QMS 문서-레지스트리 동기 확인
        run: python tools/generate_qms_docs.py --check

      - name: 시연 RQMS 구축 후 적합성 평가 (갭이 있으면 실패)
        run: |
          python -m rqms init --db ci.db --seed
          python -m rqms conformity --db ci.db
          python -m rqms check --db ci.db
        env:
          PYTHONPATH: src

      - name: 린트
        run: |
          pip install ruff
          ruff check .
